<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập / Đăng ký – K'Bookstore</title>
  <link rel="stylesheet" href="css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* CSS trang trí riêng cho form Đăng nhập/Đăng ký */
    .auth-container { 
        background: #fff; 
        padding: 35px 30px; 
        border-radius: 12px; 
        box-shadow: 0 5px 20px rgba(0,0,0,0.08); 
        margin-bottom: 50px; 
    }
    .nav-tabs { border-bottom: 1px solid #e0d9d0; margin-bottom: 25px; }
    .nav-tabs>li { margin-bottom: -1px; }
    .nav-tabs>li>a { 
        color: #777; 
        font-weight: 600; 
        font-size: 16px; 
        border: none; 
        border-bottom: 3px solid transparent; 
        background: transparent !important;
    }
    .nav-tabs>li.active>a, .nav-tabs>li.active>a:focus, .nav-tabs>li.active>a:hover { 
        color: #e67e22; 
        border-bottom: 3px solid #e67e22; 
    }
    .nav-tabs>li>a:hover { color: #e67e22; border-bottom: 3px solid #f39c12; }
    
    .btn-auth { 
        background-color: #e67e22; 
        color: white; 
        font-weight: bold; 
        padding: 12px; 
        font-size: 16px;
        border-radius: 6px;
        transition: all 0.3s; 
    }
    .btn-auth:hover { background-color: #d35400; color: white; }
    
    /* FIX LỖI NÚT GOOGLE & FACEBOOK */
    .social-btn { 
        width: 48%; 
        border-radius: 6px; 
        font-weight: 600; 
        padding: 10px; 
        border: none;
        color: #fff !important; /* Ép buộc chữ luôn màu trắng */
        transition: opacity 0.3s;
    }
    .social-btn:hover {
        opacity: 0.85;
        color: #fff !important;
    }
    .btn-google { background-color: #dd4b39; }
    .btn-facebook { background-color: #3b5998; }
  </style>
</head>
<body style="background-color: #f8f9fa;">

<div id="navbar-placeholder"></div>

<div style="padding-top:100px;"></div>

<div class="container" style="min-height: 65vh;">
  <div class="row">
    <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
      <div class="auth-container">
        
        <ul class="nav nav-tabs nav-justified" role="tablist">
          <li role="presentation" class="active">
              <a href="#login" aria-controls="login" role="tab" data-toggle="tab">ĐĂNG NHẬP</a>
          </li>
          <li role="presentation">
              <a href="#register" aria-controls="register" role="tab" data-toggle="tab">ĐĂNG KÝ MỚI</a>
          </li>
        </ul>

        <div class="tab-content">
          
          <div role="tabpanel" class="tab-pane fade in active" id="login">
            <form onsubmit="event.preventDefault(); alert('Đăng nhập thành công!'); window.location.href='index.html';">
              <div class="form-group">
                <label>Email hoặc Tên đăng nhập</label>
                <input type="email" class="form-control" placeholder="Nhập email của bạn..." required>
              </div>
              <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" class="form-control" placeholder="Nhập mật khẩu..." required>
              </div>
              
              <div class="checkbox" style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-weight: normal;">
                  <input type="checkbox"> Ghi nhớ tài khoản
                </label>
                <a href="#" style="color: #e67e22; font-size: 13px;">Quên mật khẩu?</a>
              </div>
              
              <button type="submit" class="btn btn-auth btn-block" style="margin-top: 15px;">ĐĂNG NHẬP</button>
            </form>

            <div class="text-center" style="margin-top: 25px;">
              <p style="color: #999; font-size: 13px;">Hoặc đăng nhập nhanh bằng:</p>
              <div style="display: flex; justify-content: space-between;">
                  <button class="btn social-btn btn-google"><i class="fa fa-google"></i> Google</button>
                  <button class="btn social-btn btn-facebook"><i class="fa fa-facebook-f"></i> Facebook</button>
              </div>
            </div>
          </div>

          <div role="tabpanel" class="tab-pane fade" id="register">
            <form onsubmit="event.preventDefault(); alert('Đăng ký tài khoản thành công! Vui lòng đăng nhập.'); $('.nav-tabs a[href=\'#login\']').tab('show');">
              <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" class="form-control" placeholder="Nhập họ tên đầy đủ..." required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Nhập địa chỉ email..." required>
              </div>
              <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" class="form-control" placeholder="Nhập số điện thoại liên hệ..." required>
              </div>
              <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" class="form-control" placeholder="Tạo mật khẩu (ít nhất 6 ký tự)" required minlength="6">
              </div>
              <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" class="form-control" placeholder="Nhập lại mật khẩu vừa tạo" required minlength="6">
              </div>
              
              <div class="checkbox">
                <label style="font-weight: normal; font-size: 13px;">
                  <input type="checkbox" required> Tôi đồng ý với các <a href="#" style="color: #e67e22;">Điều khoản dịch vụ</a> và <a href="#" style="color: #e67e22;">Chính sách bảo mật</a> của K'Bookstore.
                </label>
              </div>
              
              <button type="submit" class="btn btn-auth btn-block" style="margin-top: 15px;">TẠO TÀI KHOẢN</button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="row footer-top">
      <div class="col-md-6">
        <span class="footer-brand"><span class="brand-k">K'</span><span class="brand-book">Bookstore</span></span>
        <p>Nhà sách trực tuyến uy tín hàng đầu Việt Nam.</p>
      </div>
      <div class="col-md-6 text-right">
        <ul class="footer-links" style="display:inline-block; text-align:left; list-style:none; padding:0;">
          <li><a href="index.html"><i class="fa fa-home" style="width: 20px;"></i> Trang chủ</a></li>
          <li><a href="index.html#contact"><i class="fa fa-envelope" style="width: 20px;"></i> Liên hệ</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom text-center">
      <p>&copy; 2024 K'Bookstore. Tất cả quyền được bảo lưu.</p>
    </div>
  </div>
</footer>

<div id="toast" class="toast-msg" style="display:none;"></div>

<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
